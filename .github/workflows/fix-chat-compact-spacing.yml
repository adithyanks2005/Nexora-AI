name: Fix compact chat spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compact chat renderer and bubble spacing
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/index.html")
          text = path.read_text(encoding="utf-8")

          # Tighten the chat bubble line height without affecting the rest of the app.
          text = text.replace(
              ".msg-bubble{\n  padding:12px 18px;border-radius:var(--radius);\n  font-size:14px;line-height:1.75;",
              ".msg-bubble{\n  padding:12px 18px;border-radius:var(--radius);\n  font-size:14px;line-height:1.55;",
              1,
          )

          # Replace the chat markdown renderer with compact block formatting.
          start = text.find("function renderMarkdown(text) {")
          end = text.find("\n}\n\nasync function loadChatHistory()", start)
          if start == -1 or end == -1:
              raise SystemExit("renderMarkdown function not found")

          new_fn = r'''function renderMarkdown(text) {
  if (!text) return '';

  const normalized = String(text)
    .replace(/\u00a0/g, ' ')
    .replace(/\r\n?/g, '\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();

  return normalized
    .replace(/^>\s?(.*)$/gm, '<div class="md-disclaimer">$1</div>')
    .replace(/^#{1,3}\s+(.+)$/gm, '<div class="md-heading">$1</div>')
    .replace(/^[-•]\s*(.+)$/gm, '<div class="md-bullet"><span class="md-marker">•</span><span>$1</span></div>')
    .replace(/^\d+\.\s+(.+)$/gm, '<div class="md-bullet"><span class="md-marker">›</span><span>$1</span></div>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n\n/g, '<div class="md-section-gap"></div>')
    .replace(/\n/g, '<br>');
}
'''
          text = text[:start] + new_fn + text[end + 2:]

          marker = "/* Compact chat response spacing v2 */"
          if marker not in text:
              style = '''\n<style>\n/* Compact chat response spacing v2 */\n.msg-bubble{line-height:1.55;}\n.md-heading{display:block;font-size:15px;font-weight:700;line-height:1.35;margin:10px 0 5px;}\n.md-bullet{display:flex;align-items:flex-start;gap:7px;line-height:1.55;margin:3px 0;}\n.md-marker{color:var(--accent);flex:0 0 auto;}\n.md-section-gap{height:8px;}\n.md-disclaimer{display:block;margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--warn);background:rgba(249,199,79,0.06);border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45;}\n</style>\n'''
              pos = text.find('</head>')
              if pos == -1:
                  raise SystemExit('</head> not found')
              text = text[:pos] + style + text[pos:]

          path.write_text(text, encoding="utf-8")

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html .github/workflows/fix-chat-compact-spacing.yml
          git commit -m "fix: compact chat response layout"
          git rm .github/workflows/fix-chat-compact-spacing.yml
          git commit -m "chore: remove compact spacing patch workflow"
          git push
