name: Add medication safety disclaimer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add server-side medication disclaimer
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/ai.py")
          text = path.read_text(encoding="utf-8")

          marker = "MEDICATION_DISCLAIMER = (\n"
          if marker not in text:
              needle = "def _groq_error(status_code: int, body: str) -> str:\n"
              disclaimer = '''MEDICATION_DISCLAIMER = (\n    "\\n\\n> ⚠️ **Medication disclaimer:** Medication information is for educational purposes only. "\n    "Do not start, stop, or change any medicine or dose without advice from a qualified "\n    "healthcare professional. Check allergies, pregnancy, age, existing conditions, and "\n    "possible drug interactions with a doctor or pharmacist."\n)\n\n\ndef _contains_medication_advice(text: str) -> bool:\n    lowered = (text or "").lower()\n    medication_terms = (\n        "medication", "medicine", "tablet", "capsule", "syrup", "spray", "ointment",\n        "dose", "dosage", "mg", "mcg", "ml", "paracetamol", "acetaminophen", "ibuprofen",\n        "antibiotic", "antihistamine", "saline nasal spray", "oral rehydration",\n        "take twice", "take once", "per day", "every ", "after meals", "before meals"\n    )\n    return any(term in lowered for term in medication_terms)\n\n\ndef _ensure_medication_disclaimer(text: str) -> str:\n    if not text or "Medication disclaimer:" in text:\n        return text\n    return text + MEDICATION_DISCLAIMER if _contains_medication_advice(text) else text\n\n\n'''
              if needle not in text:
                  raise SystemExit("Could not find insertion point in backend/ai.py")
              text = text.replace(needle, disclaimer + needle, 1)

          old = '    return reply\n\n\nasync def stream_ai'
          new = '    return _ensure_medication_disclaimer(reply)\n\n\nasync def stream_ai'
          if old in text:
              text = text.replace(old, new, 1)
          else:
              raise SystemExit("Could not patch call_ai return")

          old_stream = '''                    if content:\n                        yield content\n                return\n'''
          new_stream = '''                    if content:\n                        collected.append(content)\n                        yield content\n                if collected:\n                    full_text = "".join(collected)\n                    if _contains_medication_advice(full_text) and "Medication disclaimer:" not in full_text:\n                        yield MEDICATION_DISCLAIMER\n                return\n'''
          if old_stream in text and "collected.append(content)" not in text:
              text = text.replace(old_stream, new_stream, 1)
          elif "collected.append(content)" in text:
              pass
          else:
              raise SystemExit("Could not patch streaming return")

          # Ensure the list used by streaming is defined.
          stream_anchor = '    headers = {\n'
          # The streaming implementation already uses a generator-local response;
          # add a collection before the retry loop if needed.
          if "collected: list[str] = []" not in text:
              text = text.replace('    for attempt in range(2):\n', '    collected: list[str] = []\n\n    for attempt in range(2):\n', 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/ai.py .github/workflows/add-medication-disclaimer.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: add medication safety disclaimer to AI advice"
          git push
