name: Optimize AI response completeness

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Optimize response generation
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/ai.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace("MAX_HISTORY_MESSAGES = 12", "MAX_HISTORY_MESSAGES = 10")
          text = text.replace("MAX_MESSAGE_CHARS = 1400", "MAX_MESSAGE_CHARS = 1100")
          text = text.replace(
              "4. Keep responses direct, well-formatted, and under 200 words to save tokens while maintaining top clinical quality.",
              "4. Give complete, well-formatted answers, normally 250–350 words when needed. Always finish every section and sentence. Never stop mid-sentence or mid-bullet. Prioritize red flags and essential care advice if space is limited."
          )
          text = text.replace('"temperature": 0.3,', '"temperature": 0.2,')
          text = text.replace('"max_tokens": 700,', '"max_tokens": 900,')

          path.write_text(text, encoding="utf-8")

      - name: Commit optimization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/ai.py .github/workflows/optimize-ai-response.yml
          git diff --cached --quiet && exit 0
          git commit -m "perf: optimize AI response completeness"
          git push
