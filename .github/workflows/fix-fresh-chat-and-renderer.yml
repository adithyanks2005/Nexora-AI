name: Fix fresh chat and compact renderer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch frontend chat behavior
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/index.html")
          text = path.read_text(encoding="utf-8")

          # Always create a brand-new chat session whenever the page loads.
          old_session = "let currentSessionId = localStorage.getItem('nexora_session_id') || generateUUID();\nlocalStorage.setItem('nexora_session_id', currentSessionId);"
          new_session = "let currentSessionId = generateUUID();\nlocalStorage.removeItem('nexora_session_id');"
          if old_session in text:
              text = text.replace(old_session, new_session, 1)

          # Compact ChatGPT-like markdown rendering: collapse excess blank lines
          # and avoid <br><br> between every bullet.
          start = text.find("function renderMarkdown(text) {")
          end = text.find("\n}\n\nasync function loadChatHistory()", start)
          if start == -1 or end == -1:
              raise SystemExit("renderMarkdown function not found")

          new_fn = r'''function renderMarkdown(text) {
  if (!text) return '';

  const normalized = String(text)
    .replace(/\u00a0/g, ' ')
    .replace(/\r\n?/g, '\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();

  return normalized
    .replace(/^>\s?(.*)$/gm, '<div class="md-disclaimer">$1</div>')
    .replace(/^#{1,3}\s+(.+)$/gm, '<strong class="md-heading">$1</strong>')
    .replace(/^[-•]\s*(.+)$/gm, '<div class="md-bullet"><span>•</span><span>$1</span></div>')
    .replace(/^\d+\.\s+(.+)$/gm, '<div class="md-number"><span>›</span><span>$1</span></div>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n\n/g, '<div class="md-gap"></div>')
    .replace(/\n/g, '<br>');
}
'''
          text = text[:start] + new_fn + text[end + 2:]

          marker = '/* ChatGPT-like renderer */'
          if marker not in text:
              style = '''\n<style>\n/* ChatGPT-like renderer */\n.md-heading{display:block;font-size:15px;margin:8px 0 4px;font-weight:700;}\n.md-bullet,.md-number{display:flex;gap:7px;align-items:flex-start;margin:3px 0;line-height:1.55;}\n.md-bullet>span:first-child,.md-number>span:first-child{color:var(--accent);flex:0 0 auto;}\n.md-gap{height:8px;}\n.md-disclaimer{margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--warn);background:rgba(249,199,79,0.06);border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45;}\n</style>\n'''
              insert_at = text.find('</head>')
              if insert_at == -1:
                  raise SystemExit('</head> not found')
              text = text[:insert_at] + style + text[insert_at:]

          path.write_text(text, encoding="utf-8")

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html .github/workflows/fix-fresh-chat-and-renderer.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: start chats fresh and tighten response layout"
          git rm .github/workflows/fix-fresh-chat-and-renderer.yml
          git commit -m "chore: remove one-time frontend patch workflow"
          git push
