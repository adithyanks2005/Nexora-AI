name: Make chat start fresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch chat startup behavior
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/index.html")
          text = path.read_text(encoding="utf-8")

          old_session = "let currentSessionId = localStorage.getItem('nexora_session_id') || generateUUID();\nlocalStorage.setItem('nexora_session_id', currentSessionId);"
          new_session = "let currentSessionId = generateUUID();"
          if old_session in text:
              text = text.replace(old_session, new_session, 1)
          elif "let currentSessionId = generateUUID();" not in text:
              raise SystemExit("Could not locate session initialization")

          old_fn = "async function loadChatHistory() {\n  try {"
          new_fn = "async function loadChatHistory(force = false) {\n  if (!force) return;\n  try {"
          if old_fn in text:
              text = text.replace(old_fn, new_fn, 1)
          elif "async function loadChatHistory(force = false)" not in text:
              raise SystemExit("Could not locate loadChatHistory")

          old_switch = "  await loadChatHistory();\n  loadSessionList();"
          new_switch = "  await loadChatHistory(true);\n  loadSessionList();"
          if old_switch in text:
              text = text.replace(old_switch, new_switch, 1)
          elif "await loadChatHistory(true);" not in text:
              raise SystemExit("Could not locate switchSession history load")

          path.write_text(text, encoding="utf-8")

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html .github/workflows/chatgpt-style-new-chat.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: start each page with a fresh chat"
          git rm .github/workflows/chatgpt-style-new-chat.yml
          git commit -m "chore: remove one-time chat startup workflow"
          git push
