name: Fix chat response spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tighten markdown/chat spacing
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/index.html")
          text = path.read_text(encoding="utf-8")

          start = text.find("function renderMarkdown(text) {")
          end = text.find("\n}\n\nasync function loadChatHistory()", start)
          if start == -1 or end == -1:
              raise SystemExit("renderMarkdown function not found")

          new_fn = r'''function renderMarkdown(text) {
  if (!text) return '';

  // Normalize model whitespace so streamed markdown does not create large gaps.
  const normalized = String(text)
    .replace(/\u00a0/g, ' ')
    .replace(/\r\n?/g, '\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();

  return normalized
    .replace(/^>\s?(.*)$/gm, '<div class="md-disclaimer">$1</div>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/^#{1,3}\s+(.+)$/gm, '<strong style="font-size:15px;display:block;margin:8px 0 4px;">$1</strong>')
    .replace(/^[-•]\s*(.+)$/gm, '<div style="display:flex;gap:6px;margin:1px 0;"><span style="color:var(--accent);flex-shrink:0;">•</span><span>$1</span></div>')
    .replace(/^\d+\.\s+(.+)$/gm, '<div style="display:flex;gap:6px;margin:1px 0;"><span style="color:var(--accent);flex-shrink:0;">›</span><span>$1</span></div>')
    .replace(/\n\n/g, '<br>')
    .replace(/\n/g, '<br>');
}
'''

          text = text[:start] + new_fn + text[end + 2:]

          marker = '/* Chat markdown spacing fix */'
          if marker not in text:
              style = '''\n<style>\n/* Chat markdown spacing fix */\n.md-disclaimer {\n  margin: 8px 0 0;\n  padding: 8px 10px;\n  border-left: 3px solid var(--warn);\n  background: rgba(249,199,79,0.06);\n  border-radius: 0 7px 7px 0;\n  font-size: 12.5px;\n  line-height: 1.45;\n}\n</style>\n'''
              insert_at = text.find('</head>')
              if insert_at == -1:
                  raise SystemExit("</head> not found")
              text = text[:insert_at] + style + text[insert_at:]

          path.write_text(text, encoding="utf-8")

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html .github/workflows/fix-chat-spacing.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: tighten chat response spacing"
          git push
