<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nexora AI">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d24"/>
      <stop offset="100%" stop-color="#0b1a3e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#4f9cf9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle radial glow -->
  <radialGradient id="rg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="112" fill="url(#rg)"/>

  <g filter="url(#glow)">
    <!-- Staff / Rod -->
    <rect x="240" y="80" width="32" height="360" rx="16" fill="url(#teal)"/>

    <!-- Snake body — sinusoidal path wrapping around staff -->
    <path d="
      M 256 110
      C 310 130, 330 160, 290 190
      C 250 220, 210 230, 220 265
      C 230 300, 310 310, 295 345
      C 280 375, 210 375, 220 405
    "
    fill="none"
    stroke="url(#teal)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
    />

    <!-- Snake head -->
    <!-- Head body -->
    <ellipse cx="232" cy="408" rx="28" ry="20" fill="url(#teal)" transform="rotate(-20 232 408)"/>
    <!-- Eye -->
    <circle cx="222" cy="400" r="5" fill="#060d24"/>
    <!-- Tongue -->
    <line x1="210" y1="414" x2="196" y2="422" stroke="url(#teal)" stroke-width="5" stroke-linecap="round"/>
    <line x1="210" y1="414" x2="198" y2="410" stroke="url(#teal)" stroke-width="5" stroke-linecap="round"/>

    <!-- Top of staff — small cross cap -->
    <rect x="220" y="76" width="72" height="22" rx="11" fill="url(#teal)"/>
  </g>
</svg>
