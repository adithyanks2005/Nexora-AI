<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nexora AI">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1f"/>
      <stop offset="100%" stop-color="#0d1a3a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b4cc"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4cc"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle radial glow center -->
  <radialGradient id="center-glow" cx="55%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="108" fill="url(#center-glow)"/>

  <!-- DNA helix left strand -->
  <g filter="url(#glow-sm)" opacity="0.9">
    <!-- Left spine -->
    <path d="M148 80 C128 140 168 200 148 260 C128 320 168 380 148 440" 
          fill="none" stroke="url(#teal)" stroke-width="9" stroke-linecap="round"/>
    <!-- Right spine -->
    <path d="M188 80 C208 140 168 200 188 260 C208 320 168 380 188 440" 
          fill="none" stroke="url(#teal2)" stroke-width="9" stroke-linecap="round"/>
    <!-- Rungs -->
    <line x1="148" y1="118" x2="188" y2="106" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="152" y1="158" x2="184" y2="158" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="156" y1="198" x2="180" y2="200" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="148" y1="240" x2="188" y2="252" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="152" y1="282" x2="184" y2="278" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="156" y1="320" x2="180" y2="322" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="148" y1="362" x2="188" y2="374" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="152" y1="404" x2="184" y2="400" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Medical cross (right side, center) -->
  <g filter="url(#glow)" transform="translate(290, 200)">
    <!-- Cross outer border glow -->
    <rect x="-52" y="-18" width="36" height="100" rx="10" fill="none" stroke="url(#teal)" stroke-width="3" opacity="0.4"/>
    <rect x="-70" y="0" width="72" height="36" rx="10" fill="none" stroke="url(#teal)" stroke-width="3" opacity="0.4"/>
    <!-- Cross fill -->
    <rect x="-48" y="-14" width="28" height="92" rx="8" fill="url(#teal)" opacity="0.15"/>
    <rect x="-66" y="4" width="64" height="28" rx="8" fill="url(#teal)" opacity="0.15"/>
    <!-- Cross stroke -->
    <rect x="-48" y="-14" width="28" height="92" rx="8" fill="none" stroke="url(#teal)" stroke-width="4.5"/>
    <rect x="-66" y="4" width="64" height="28" rx="8" fill="none" stroke="url(#teal)" stroke-width="4.5"/>
  </g>

  <!-- AI circle badge (top right of cross) -->
  <g filter="url(#glow)" transform="translate(350, 168)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#teal)" stroke-width="3.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="38" fill="#060c1f" opacity="0.9"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#teal)" stroke-width="3"/>
    <!-- AI text -->
    <text x="0" y="12" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
          font-weight="900" font-size="30" fill="url(#teal)" letter-spacing="-1">AI</text>
  </g>

  <!-- Dot nodes on DNA -->
  <g filter="url(#glow-sm)">
    <circle cx="148" cy="118" r="6" fill="url(#teal)"/>
    <circle cx="188" cy="106" r="6" fill="url(#teal)"/>
    <circle cx="148" cy="240" r="6" fill="url(#teal)"/>
    <circle cx="188" cy="252" r="6" fill="url(#teal)"/>
    <circle cx="148" cy="362" r="6" fill="url(#teal)"/>
    <circle cx="188" cy="374" r="6" fill="url(#teal)"/>
  </g>
</svg>
