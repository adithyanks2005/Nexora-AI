<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nexora AI">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f2e"/>
      <stop offset="100%" stop-color="#0d1f4a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#4f9cf9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle radial glow -->
  <radialGradient id="rg" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="110" fill="url(#rg)"/>

  <!-- Bold N letterform -->
  <g filter="url(#glow-sm)">
    <text
      x="256" y="330"
      text-anchor="middle"
      font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
      font-weight="900"
      font-size="310"
      fill="url(#teal)"
      letter-spacing="-8"
    >N</text>
  </g>

  <!-- Heartbeat / ECG line overlaid across the N -->
  <g filter="url(#glow)">
    <polyline
      points="
        60,270
        130,270
        160,270
        185,155
        215,390
        245,200
        268,200
        285,270
        355,270
        450,270
      "
      fill="none"
      stroke="url(#teal)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Small dot at peak -->
  <circle cx="245" cy="200" r="16" fill="#00e5ff" filter="url(#glow)"/>
</svg>
